<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3a7afe">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="链接提取">
<title>链接提取工具</title>
<style>
:root {
  --bg: #f3f6fa;
  --card: #ffffff;
  --border: #dbe3ee;
  --text: #16263b;
  --text2: #52657a;
  --primary: #1769e0;
  --primary-hover: #1256ba;
  --primary-soft: #e8f0fe;
  --success: #137a4a;
  --error: #ba2b3d;
  --radius: 12px;
  --shadow: 0 10px 28px rgba(22, 38, 59, .06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #edf3fb 0, var(--bg) 280px);
  color: var(--text);
  line-height: 1.6;
}
.container { max-width: 860px; margin: 0 auto; padding: 24px 16px 96px; }

header { text-align: center; padding: 30px 0 22px; }
.eyebrow { color: var(--primary); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
header h1 { font-size: 27px; font-weight: 750; letter-spacing: -.04em; margin-top: 4px; }
header p { color: var(--text2); font-size: 14px; margin: 7px auto 0; max-width: 560px; }

.card {
  background: var(--card);
  border: 1px solid rgba(219, 227, 238, .95);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card h2, .input-label { display: block; font-size: 16px; font-weight: 650; margin-bottom: 12px; }

textarea {
  width: 100%;
  min-height: 120px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  outline: none;
  transition: border-color .15s;
}
textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(23, 105, 224, .14); }

.toolbar { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.btn {
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background .15s, opacity .15s, transform .15s;
}
.btn:focus-visible, .tab:focus-visible, .cover-button:focus-visible, .caption-toggle:focus-visible, .preview-close:focus-visible { outline: 3px solid rgba(23, 105, 224, .32); outline-offset: 2px; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-ghost { background: #edf2f8; color: var(--text); }
.btn-ghost:hover { background: #e2e9f2; }
.btn-danger { background: #fdecec; color: var(--error); }
.btn-danger:hover { background: #fadcdc; }
.btn-danger.confirming { background: var(--error); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 6px; }

.status { margin-top: 12px; font-size: 13px; color: var(--text2); }
.status.error { color: var(--error); }
.link-count {
  margin-top: 8px;
  font-size: 13px;
  color: var(--text2);
  min-height: 20px;
}
.link-count .count {
  font-weight: 600;
  color: var(--primary);
}
.link-count .count.zero { color: var(--text2); }

.result-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  animation: fadeIn .25s ease;
  box-shadow: var(--shadow);
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.result-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.platform-tag {
  font-size: 12px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 999px;
}
.platform-douyin { background: #1a1a1a; color: #fff; }
.platform-xiaohongshu { background: #fff0f5; color: #d63384; }
.result-index { font-size: 13px; color: var(--text2); }
.result-badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; font-weight: 500; }
.badge-ok { background: #e8f7ee; color: var(--success); }
.badge-fail { background: #fdecec; color: var(--error); }

.result-main { display: flex; gap: 14px; }
.cover-wrap { flex-shrink: 0; }
.cover-button {
  position: relative; display: block; width: 76px; height: 100px; padding: 0;
  overflow: hidden; border: 1px solid var(--border); border-radius: 9px;
  background: #e8eef6; cursor: zoom-in;
}
.cover-button:disabled { cursor: default; }
.cover-placeholder {
  position: absolute; inset: 0; display: grid; place-items: center;
  color: #fff; font-size: 18px; font-weight: 700;
  background: linear-gradient(155deg, #2b598e, #173b67);
}
.cover-button.cover-xhs .cover-placeholder { background: linear-gradient(155deg, #e44e70, #a7193a); }
.cover-button.image-failed .cover-hint { display: none; }
.cover-hint {
  position: absolute; right: 5px; bottom: 5px; z-index: 2; padding: 1px 5px;
  border-radius: 4px; background: rgba(22, 38, 59, .74); color: #fff; font-size: 10px;
}
.cover {
  position: relative; z-index: 1; width: 100%; height: 100%;
  object-fit: cover;
  background: #e8eef6;
}
.result-content { flex: 1; min-width: 0; }

.field { margin-bottom: 8px; }
.field-label { font-size: 12px; color: var(--text2); margin-bottom: 2px; }
.field-value {
  background: #f7f8fa;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 13px;
  word-break: break-all;
  white-space: pre-wrap;
}
.field-value.link {
  color: var(--primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  word-break: keep-all;
}
.field-value.caption {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.field-value.caption.expanded { -webkit-line-clamp: unset; }
.caption-wrap { position: relative; }
.caption-toggle {
  display: none;
  margin-top: 6px;
  padding: 2px 12px;
  font-size: 12px;
  color: var(--primary);
  background: #f7f8fa;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
}
.caption-wrap.show-toggle .caption-toggle { display: block; margin-left: auto; }
.field-value.empty { color: var(--text2); font-style: italic; }

.copy-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.copy-row .btn { flex: 1; min-width: 120px; white-space: nowrap; }
.btn-copy { background: var(--primary); color: #fff; }
.btn-copy:hover:not(:disabled) { background: var(--primary-hover); }
.btn-copy[data-kind="caption"] { background: var(--primary-soft); color: #124c9d; }
.btn-copy[data-kind="caption"]:hover:not(:disabled) { background: #dce9fc; }
.btn-copy.copied { background: var(--success); }
.result-actions { display: flex; justify-content: flex-end; margin-top: 10px; }

.history-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.history-item:last-child { border-bottom: none; }
.history-link { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-actions { display: flex; gap: 6px; flex-shrink: 0; }
.history-card-body { display: flex; gap: 12px; margin-top: 8px; }
.history-card-content { flex: 1; min-width: 0; }
.history-card-body .cover-button { width: 56px; height: 74px; }

.hidden { display: none !important; }
.tab-bar { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab {
  padding: 8px 16px;
  font-size: 14px;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--text2);
  border-bottom: 2px solid transparent;
  font-weight: 500;
}
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.stat-card .num { font-size: 28px; font-weight: 600; color: var(--text); line-height: 1.2; }
.stat-card .label { font-size: 12px; color: var(--text2); margin-top: 4px; }
.stat-card .sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.stat-card.ok .num { color: var(--success); }
.stat-card.fail .num { color: var(--error); }

.trend-line { width: 100%; height: 160px; display: block; margin-top: 8px; }
.trend-line .grid-line { stroke: var(--border); stroke-width: 0.5; }
.trend-line .axis-label { font-size: 11px; fill: var(--text2); }
.trend-line .dot {
  fill: var(--primary);
  stroke: #fff;
  stroke-width: 1.5;
  cursor: pointer;
}
.trend-line .dot:hover { fill: var(--primary-hover); }
.trend-line .value-label { font-size: 11px; fill: var(--text2); }

.platform-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.platform-chip {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 999px;
  background: #eef1f5;
  color: var(--text);
}

footer { text-align: center; color: var(--text2); font-size: 12px; margin-top: 32px; }
.footer-note { margin-bottom: 4px; }
.footer-author { color: #9aa0a8; font-size: 11px; }

.loading-spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: -2px;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
  position: fixed;
  top: 20px; left: 50%;
  transform: translateX(-50%);
  background: #16263b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 999;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

.cover-preview {
  position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
  padding: 24px; background: rgba(12, 24, 40, .76); backdrop-filter: blur(4px);
}
.preview-dialog { position: relative; width: min(100%, 480px); max-height: 100%; }
.preview-image { display: block; width: 100%; max-height: calc(100vh - 96px); object-fit: contain; border-radius: 12px; background: #0b1726; }
.preview-close {
  position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border: 0;
  border-radius: 50%; background: rgba(12, 24, 40, .78); color: #fff; font-size: 22px; cursor: pointer;
}

/* ================= 移动端适配（A/C 项） ================= */
@media (max-width: 600px) {
  .container { padding: 16px 12px 72px; }
  header { padding: 18px 0 14px; }
  header h1 { font-size: 23px; }
  header p { font-size: 13px; }
  .card { padding: 14px; }
  textarea { min-height: 96px; font-size: 14px; }
  .toolbar { gap: 8px; }
  .toolbar .btn { flex: 1; padding: 12px 10px; font-size: 14px; }
  /* 触控区 ≥44px（手机标准） */
  .btn { min-height: 44px; }
  .copy-row .btn { min-height: 44px; font-size: 14px; }
  /* 封面缩小 */
  .cover-button { width: 64px; height: 84px; }
  /* 统计卡片窄屏单列 */
  .stats-grid { grid-template-columns: 1fr; gap: 10px; }
  .stat-card .num { font-size: 24px; }
  /* 趋势图在小屏高度自适应 */
  .trend-line { height: 140px; }
  /* tab 栏触控加大 */
  .tab { padding: 10px 14px; font-size: 14px; }
  .caption-toggle { min-width: 44px; min-height: 44px; }
  /* 结果卡片间距收紧 */
  .result-item { padding: 12px; }
  .field-value { font-size: 13px; }
  /* toast 顶部避开刘海 */
  .toast { top: calc(12px + env(safe-area-inset-top)); }
  .footer-author { font-size: 10px; }
  .cover-preview { padding: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
}

/* 大屏更大方 */
@media (min-width: 901px) {
  .container { max-width: 960px; }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="eyebrow">CONTENT LINK DESK</div>
    <h1>🔗 链接提取工具</h1>
    <p>粘贴抖音 / 小红书分享链接，批量提取转换链接与文案，逐条复制</p>
  </header>

  <div class="tab-bar" role="tablist" aria-label="功能导航">
    <button class="tab active" id="tab-button-extract" role="tab" aria-selected="true" aria-controls="tab-extract" data-tab="extract" onclick="switchTab('extract')" onkeydown="handleTabKey(event)">提取</button>
    <button class="tab" id="tab-button-stats" role="tab" aria-selected="false" aria-controls="tab-stats" data-tab="stats" onclick="switchTab('stats')" onkeydown="handleTabKey(event)">统计</button>
    <button class="tab" id="tab-button-history" role="tab" aria-selected="false" aria-controls="tab-history" data-tab="history" onclick="switchTab('history')" onkeydown="handleTabKey(event)">历史记录</button>
  </div>

  <!-- 提取页 -->
  <div id="tab-extract" role="tabpanel" aria-labelledby="tab-button-extract">
    <div class="card">
      <label class="input-label" for="inputUrls">输入链接</label>
      <textarea id="inputUrls" placeholder="粘贴抖音/小红书分享链接，每行一个，也支持整段复制（自动识别其中的链接）&#10;&#10;粘贴后 1 秒自动开始提取" oninput="onInputChange()"></textarea>
      <div class="link-count" id="linkCount"></div>
      <div class="toolbar">
        <button class="btn btn-primary" id="btnExtract" onclick="doExtract()">🔍 提取全部</button>
        <button class="btn btn-ghost" onclick="clearInput()">清空</button>
        <button class="btn btn-ghost hidden" id="btnRetryFailed" onclick="retryFailedLinks()">🔄 重试失败项</button>
      </div>
      <div class="status" id="extractStatus" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <div id="results"></div>
  </div>

  <!-- 统计页 -->
  <div id="tab-stats" class="hidden" role="tabpanel" aria-labelledby="tab-button-stats">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="card" style="margin-top:16px;">
      <h2>近 7 天提取趋势</h2>
      <div id="statsTrend"></div>
    </div>
  </div>

  <!-- 历史页 -->
  <div id="tab-history" class="hidden" role="tabpanel" aria-labelledby="tab-button-history">
    <div class="card">
      <div class="toolbar" style="margin-top:0;">
        <button class="btn btn-ghost" onclick="loadHistory()">🔄 刷新</button>
        <button class="btn btn-danger" id="btnClearHistory" onclick="clearHistory()">🗑 清空历史</button>
      </div>
      <div class="status" id="historyStatus" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <div id="historyList"></div>
  </div>

  <footer>
    <div class="footer-note">本工具仅用于个人内容整理 · 请勿高频抓取</div>
    <div class="footer-author">作者：黄徽徽 · 联系方式：H15217830799 · 项目：链接提取工具 v1.6.0</div>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="cover-preview hidden" id="coverPreview" role="dialog" aria-modal="true" aria-labelledby="coverPreviewTitle" onclick="closeCoverPreviewOnBackdrop(event)">
  <div class="preview-dialog">
    <button class="preview-close" id="coverPreviewClose" type="button" onclick="closeCoverPreview()" aria-label="关闭封面预览">×</button>
    <img class="preview-image" id="coverPreviewImage" alt="">
    <p id="coverPreviewTitle" class="hidden">封面预览</p>
  </div>
</div>

<script>
function getCookie(name) {
  const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
  return m ? decodeURIComponent(m[1]) : "";
}
// ================= 安全：设备签名 =================
let deviceId = localStorage.getItem("device_id") || "";
let deviceSig = localStorage.getItem("device_sig") || "";

/** 统一的 API 请求封装：自动带设备签名，处理限流 */
async function apiFetch(url, options = {}) {
  const headers = { ...(options.headers || {}) };
  headers["Content-Type"] = "application/json";
  if (deviceId) headers["X-Device-Id"] = deviceId;
  if (deviceSig) headers["X-Device-Sig"] = deviceSig;

  const res = await fetch(url, { ...options, headers });

  if (res.status === 429) {
    const json = await res.json().catch(() => ({}));
    throw new Error(json.error || "请求过于频繁");
  }
  if (!res.ok) {
    const json = await res.json().catch(() => ({}));
    throw new Error(json.error || "请求失败");
  }
  return handleDevicePayload(res);
}

/** 从响应中提取并保存 device_id + device_sig（后端签发的） */
async function handleDevicePayload(res) {
  const clone = res.clone();
  const json = await res.json().catch(() => ({}));
  if (json.device_id && json.device_sig) {
    deviceId = json.device_id;
    deviceSig = json.device_sig;
    localStorage.setItem("device_id", deviceId);
    localStorage.setItem("device_sig", deviceSig);
  }
  return json;
}

/** 构建带设备签名的请求头 */
function buildHeaders(extra = {}) {
  const headers = { "Content-Type": "application/json", ...extra };
  if (deviceId) headers["X-Device-Id"] = deviceId;
  if (deviceSig) headers["X-Device-Sig"] = deviceSig;
  return headers;
}

// ---------- 移动端交互（C 项） ----------
// 注册 PWA Service Worker（HTTP 环境注册失败会静默忽略，不影响功能）
if ("serviceWorker" in navigator && window.isSecureContext) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/static/sw.js").catch(function () {
      /* HTTP 环境无法注册，忽略 */
    });
  });
}

// 输入框聚焦时自动滚动到可视区，避免手机键盘遮挡
(function () {
  const ta = document.getElementById("inputUrls");
  if (!ta) return;
  const isMobile = () => window.matchMedia("(max-width: 600px)").matches;
  ta.addEventListener("focus", function () {
    if (isMobile()) {
      setTimeout(() => {
        const rect = ta.getBoundingClientRect();
        const viewH = window.innerHeight;
        // 若输入框下半部分超出可视区，滚动到合适位置
        if (rect.bottom > viewH * 0.55) {
          window.scrollTo({ top: ta.offsetTop - 80, behavior: "smooth" });
        }
      }, 300);
    }
  });
})();

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1600);
}

let coverPreviewTrigger = null;
let coverPreviewBodyOverflow = "";

function openCoverPreview(src, alt) {
  if (!src) return;
  const modal = document.getElementById("coverPreview");
  const image = document.getElementById("coverPreviewImage");
  const title = document.getElementById("coverPreviewTitle");
  coverPreviewTrigger = document.activeElement;
  coverPreviewBodyOverflow = document.body.style.overflow;
  image.src = src;
  image.alt = alt || "内容封面";
  title.textContent = (alt || "内容封面") + "预览";
  modal.classList.remove("hidden");
  document.body.style.overflow = "hidden";
  document.getElementById("coverPreviewClose").focus();
}

function closeCoverPreview() {
  const modal = document.getElementById("coverPreview");
  if (modal.classList.contains("hidden")) return;
  modal.classList.add("hidden");
  document.getElementById("coverPreviewImage").removeAttribute("src");
  document.body.style.overflow = coverPreviewBodyOverflow;
  if (coverPreviewTrigger && typeof coverPreviewTrigger.focus === "function") coverPreviewTrigger.focus();
  coverPreviewTrigger = null;
}

function closeCoverPreviewOnBackdrop(event) {
  if (event.target === event.currentTarget) closeCoverPreview();
}

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") closeCoverPreview();
});

function switchTab(tab) {
  document.querySelectorAll(".tab").forEach(t => {
    const active = t.dataset.tab === tab;
    t.classList.toggle("active", active);
    t.setAttribute("aria-selected", String(active));
    t.tabIndex = active ? 0 : -1;
  });
  document.getElementById("tab-extract").classList.toggle("hidden", tab !== "extract");
  document.getElementById("tab-stats").classList.toggle("hidden", tab !== "stats");
  document.getElementById("tab-history").classList.toggle("hidden", tab !== "history");
  if (tab === "stats") loadStats();
  if (tab === "history") loadHistory();
}

function handleTabKey(event) {
  if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
  const tabs = [...document.querySelectorAll(".tab")];
  const current = tabs.indexOf(event.currentTarget);
  let next = current;
  if (event.key === "ArrowLeft") next = (current - 1 + tabs.length) % tabs.length;
  if (event.key === "ArrowRight") next = (current + 1) % tabs.length;
  if (event.key === "Home") next = 0;
  if (event.key === "End") next = tabs.length - 1;
  event.preventDefault();
  tabs[next].focus();
  switchTab(tabs[next].dataset.tab);
}

function clearInput() {
  document.getElementById("inputUrls").value = "";
  document.getElementById("extractStatus").textContent = "";
  document.getElementById("results").innerHTML = "";
  lastAutoValue = "";
  clearTimeout(autoExtractTimer);
  updateLinkCount();
}

// ---------------------------------------------------------------- 链接识别

/** 从文本中提取所有 URL（与后端正则一致） */
function extractUrls(text) {
  const re = /https?:\/\/[^\s\u4e00-\u9fff]+/g;
  const found = (text || "").match(re) || [];
  const seen = new Set();
  return found
    .map(u => u.trim().replace(/[.,;:!?，。；：！？）】》]+$/g, ""))
    .filter(u => u && !seen.has(u) && seen.add(u));
}

/** 实时统计输入框中的链接数 */
function updateLinkCount() {
  const raw = document.getElementById("inputUrls").value;
  const count = extractUrls(raw).length;
  const el = document.getElementById("linkCount");
  if (count === 0) {
    el.innerHTML = "";
  } else {
    el.innerHTML = `🔗 已识别 <span class="count">${count}</span> 条链接` + (count > 20 ? '<span style="color:var(--error);margin-left:8px;">（超过 20 条上限，请分批）</span>' : "");
  }
}

// ---------------------------------------------------------------- 复制

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    flashCopied(btn);
  } catch (e) {
    // 非安全上下文（http://IP）时降级
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      flashCopied(btn);
    } catch (e2) {
      showToast("复制失败，请手动选择复制");
    }
    document.body.removeChild(ta);
  }
}

function flashCopied(btn) {
  const original = btn.textContent;
  btn.textContent = "✅ 已复制";
  btn.classList.add("copied");
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove("copied");
  }, 1200);
}

// ---------------------------------------------------------------- 提取

let autoExtractTimer = null;
let lastAutoValue = "";      // 上次自动提取的内容，避免重复提取
let extractingNow = false;   // 提取中防重复
let latestResults = [];

/** 输入变化：更新计数 + 防抖 1 秒自动提取 */
function onInputChange() {
  updateLinkCount();
  clearTimeout(autoExtractTimer);
  const raw = document.getElementById("inputUrls").value;
  if (extractingNow || !raw.trim()) return;
  autoExtractTimer = setTimeout(() => {
    if (raw !== lastAutoValue && extractUrls(raw).length) {
      doExtract(true);
    }
  }, 1000);
}

async function doExtract(isAuto = false) {
  const raw = document.getElementById("inputUrls").value;
  const urls = extractUrls(raw);
  if (!urls.length) {
    if (!isAuto) showToast("未识别到链接，请粘贴抖音或小红书分享链接");
    return;
  }
  if (urls.length > 20) {
    if (!isAuto) showToast("一次最多 20 条链接，请分批提取");
    return;
  }
  if (extractingNow) return;
  extractingNow = true;

  const btn = document.getElementById("btnExtract");
  const status = document.getElementById("extractStatus");
  const box = document.getElementById("results");
  const retryFailedBtn = document.getElementById("btnRetryFailed");
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>提取中...';
  status.textContent = `正在提取 ${urls.length} 条链接...`;
  status.classList.remove("error");
  box.innerHTML = "";  // 清空旧结果，流式逐条追加
  latestResults = [];
  retryFailedBtn.classList.add("hidden");

  let okCount = 0;
  let failCount = 0;

  try {
    let res = await fetch("/api/extract", {
      method: "POST",
      headers: buildHeaders(),
      body: JSON.stringify({ urls }),
    });
    // 请求失败：直接抛出错误信息
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || "请求失败");
    }
    if (!res.body) throw new Error("浏览器不支持流式响应");

    // 流式读取 ndjson：每条完成即时渲染
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    let appended = 0;
    let deviceIdFromServer = "";
    let deviceSigFromServer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();  // 最后一段可能不完整，留到下次
      for (const line of lines) {
        if (!line.trim()) continue;
        let msg;
        try { msg = JSON.parse(line); } catch (e) { continue; }
        if (msg.type === "start") {
          if (msg.device_id && msg.device_sig) {
            deviceIdFromServer = msg.device_id;
            deviceSigFromServer = msg.device_sig;
          }
          status.textContent = `正在提取 ${msg.total} 条链接...（完成 ${0}/${msg.total}）`;
        } else if (msg.type === "item") {
          const r = msg.data;
          r.source_index = Number.isInteger(msg.source_index) ? msg.source_index : appended;
          latestResults.push(r);
          appended++;
          if (r.success) okCount++; else failCount++;
          const item = document.createElement("div");
          item.className = "result-item";
          item.dataset.sourceIndex = String(r.source_index);
          item.dataset.originalUrl = r.original_url || "";
          item.dataset.videoUrl = r.video_url || "";
          item.innerHTML = resultCardHtml(r, appended - 1);
          box.appendChild(item);
          initCaptionToggles(item);
          status.textContent = `正在提取...（完成 ${appended}/${urls.length}，成功 ${okCount}，失败 ${failCount}）`;
        } else if (msg.type === "end") {
          // 结束帧
        }
      }
    }

    if (deviceIdFromServer && deviceSigFromServer) {
      deviceId = deviceIdFromServer;
      deviceSig = deviceSigFromServer;
      localStorage.setItem("device_id", deviceId);
      localStorage.setItem("device_sig", deviceSig);
    }
    status.textContent = `完成：成功 ${okCount} 条，失败 ${failCount} 条`;
    retryFailedBtn.classList.toggle("hidden", failCount === 0);
    lastAutoValue = raw;  // 记录已提取内容，避免自动重复提取
  } catch (e) {
    status.textContent = e.message || "提取失败";
    status.classList.add("error");
  } finally {
    extractingNow = false;
    btn.disabled = false;
    btn.textContent = "🔍 提取全部";
  }
}

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function coverPreviewHtml(coverUrl, alt, platformRaw = "") {
  const isXhs = platformRaw === "xiaohongshu";
  const label = alt || "内容封面";
  const platformMark = isXhs ? "红" : platformRaw === "douyin" ? "抖" : "图";
  const buttonClass = "cover-button" + (isXhs ? " cover-xhs" : "");
  if (!coverUrl) {
    return `<button class="${buttonClass}" type="button" disabled aria-label="暂无${esc(label)}预览">
      <span class="cover-placeholder" aria-hidden="true">${platformMark}</span>
    </button>`;
  }
  const proxyUrl = "/api/cover?url=" + encodeURIComponent(coverUrl);
  return `<button class="${buttonClass}" type="button" data-src="${proxyUrl}" data-alt="${esc(label)}" onclick="openCoverPreview(this.dataset.src, this.dataset.alt)" aria-label="预览${esc(label)}">
    <span class="cover-placeholder" aria-hidden="true">${platformMark}</span>
    <img class="cover" src="${proxyUrl}" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" onerror="this.closest('.cover-button').classList.add('image-failed'); this.remove()">
    <span class="cover-hint" aria-hidden="true">预览</span>
  </button>`;
}

/** 生成单条结果卡片 HTML（renderResults 与重试替换共用） */
function resultCardHtml(r, i) {
  const platformTag = r.platform_raw === "douyin"
    ? '<span class="platform-tag platform-douyin">抖音</span>'
    : r.platform_raw === "xiaohongshu"
      ? '<span class="platform-tag platform-xiaohongshu">小红书</span>'
      : "";

  const badge = r.success
    ? (r.partial
      ? '<span class="result-badge badge-ok">✓ 已转换</span>'
      : '<span class="result-badge badge-ok">✓ 成功</span>')
    : '<span class="result-badge badge-fail">✗ 失败</span>';

  let html = `
    <div class="result-head">
      <span class="result-index">#${i + 1}</span>
      ${platformTag}
      ${badge}
    </div>`;

  if (r.success) {
    // 优先展示：封面 + 转换链接 + 文案
    const coverLabel = r.title || r.caption || r.platform || "内容";
    const cover = `<div class="cover-wrap">${coverPreviewHtml(r.cover_url, coverLabel, r.platform_raw)}</div>`;
    html += `
      <div class="result-main">
        ${cover}
        <div class="result-content">
      <div class="field">
        <div class="field-label">转换链接（推荐复制）</div>
        <div class="field-value link" title="${esc(r.canonical_url)}">${esc(r.canonical_url)}</div>
      </div>
      <div class="field">
        <div class="field-label">文案</div>
        <div class="caption-wrap">
          <div class="field-value caption">${esc(r.caption) || "（无文案）"}</div>
          <button class="caption-toggle" type="button" onclick="toggleCaption(this)">展开全部 ▼</button>
        </div>
      </div>
      ${r.hint ? `<div class="field partial-hint"><div class="field-label">提取提示</div><div class="field-value">${esc(r.hint)}</div></div>` : ""}
      <div class="copy-row">
        <button class="btn btn-copy" onclick="copyText(unescapeHtml(this.parentNode.previousElementSibling.previousElementSibling.querySelector('.field-value').innerText), this)" data-kind="canonical">📋 复制链接</button>
        <button class="btn btn-copy" onclick="copyText(this.parentNode.parentNode.querySelector('.caption').innerText, this)" data-kind="caption">📋 复制文案</button>
      </div>
        </div>
      </div>`;

    // 附加信息
    const extra = [];
    if (r.title && r.title !== r.caption) extra.push(["标题", r.title]);
    if (r.author_name) extra.push(["作者", r.author_name]);
    if (r.publish_time) extra.push(["发布时间", r.publish_time]);
    if (r.like_count) extra.push(["点赞", String(r.like_count)]);
    // 原视频链接很长（带签名参数），标记为可折叠长链接（单行省略 + 悬停完整）
    if (r.video_url && r.video_url !== r.canonical_url) extra.push(["视频链接", r.video_url, true]);

    if (extra.length) {
      html += `<div class="field" style="margin-top:10px;"><div class="field-label">更多信息</div>`;
      extra.forEach(([label, value, isLongLink]) => {
        html += `<div class="field"><div class="field-label">${label}</div><div class="field-value${isLongLink ? " link" : ""}"${isLongLink ? ` title="${esc(value)}"` : ""}>${esc(value)}</div></div>`;
      });
      html += `</div>`;
    }
    if (r.video_url && r.video_url !== r.canonical_url) {
      html += `<div class="result-actions"><button class="btn btn-sm btn-ghost" onclick="copyText(this.closest('.result-item').dataset.videoUrl, this)">复制原视频链接</button></div>`;
    }
  } else {
    html += `
      <div class="field">
        <div class="field-label">原始链接</div>
        <div class="field-value link" title="${esc(r.original_url)}">${esc(r.original_url)}</div>
      </div>
      <div class="field">
        <div class="field-label">错误信息</div>
        <div class="field-value" style="color:var(--error);">${esc(r.error)}</div>
      </div>
      ${r.hint ? `<div class="field"><div class="field-label">提示</div><div class="field-value" style="color:var(--text2);">${esc(r.hint)}</div></div>` : ""}
      <div class="copy-row" style="margin-top:12px;">
        <button class="btn btn-ghost" onclick="copyText(this.closest('.result-item').dataset.originalUrl, this)">📋 复制原链接</button>
        <button class="btn btn-ghost" onclick="retryLink(this, ${i})">🔄 重试这条</button>
      </div>`;
  }
  return html;
}

/** 初始化容器内所有文案折叠：内容超过 3 行时显示「展开全部」按钮 */
function initCaptionToggles(container) {
  container.querySelectorAll(".caption-wrap").forEach((wrap) => {
    const cap = wrap.querySelector(".caption");
    if (cap && cap.scrollHeight > cap.clientHeight + 2) {
      wrap.classList.add("show-toggle");
    }
  });
}

/** 展开/收起文案 */
function toggleCaption(btn) {
  const wrap = btn.closest(".caption-wrap");
  const cap = wrap.querySelector(".caption");
  const expanded = cap.classList.toggle("expanded");
  btn.textContent = expanded ? "收起 ▲" : "展开全部 ▼";
}

function renderResults(results) {
  const box = document.getElementById("results");
  box.innerHTML = "";

  results.forEach((r, i) => {
    const item = document.createElement("div");
    item.className = "result-item";
    item.innerHTML = resultCardHtml(r, i);
    box.appendChild(item);
  });
  initCaptionToggles(box);
}

function unescapeHtml(s) {
  const el = document.createElement("div");
  el.innerHTML = s;
  return el.textContent;
}

/** 流式提取单条链接，返回结果对象（供重试用） */
async function extractOneStream(url) {
  let res = await fetch("/api/extract", {
    method: "POST",
    headers: buildHeaders(),
    body: JSON.stringify({ urls: [url] }),
  });
  // 请求失败：直接抛出错误信息
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || "请求失败");
  }
  if (!res.body) throw new Error("浏览器不支持流式响应");
  const reader = res.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";
  let result = null;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.trim()) continue;
      try {
        const msg = JSON.parse(line);
        if (msg.type === "item") result = msg.data;
        if (msg.type === "start" && msg.device_id && msg.device_sig) {
          deviceId = msg.device_id;
          deviceSig = msg.device_sig;
          localStorage.setItem("device_id", deviceId);
          localStorage.setItem("device_sig", deviceSig);
        }
      } catch (e) { /* 忽略坏行 */ }
    }
  }
  if (!result) throw new Error("未获取到提取结果");
  return result;
}

/** 重试单条失败链接：重新提取并替换该卡片 */
async function retryLink(btn, index) {
  const card = btn.closest(".result-item");
  const target = card && card.dataset.originalUrl;
  if (!target) { showToast("找不到原始链接，请重新粘贴"); return; }

  const oldText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>重试中...';
  try {
    const r = await extractOneStream(target);
    if (r && r.success) {
      showToast("重试成功！");
      // 用新结果替换整个卡片
      if (card) {
        card.remove();
        const box = document.getElementById("results");
        r.source_index = Number(card.dataset.sourceIndex);
        const rebuilt = renderSingleResult(r, index);
        // 重新排序索引
        const all = [...box.querySelectorAll(".result-item")];
        const pos = Math.min(index, all.length);
        if (pos === 0) box.prepend(rebuilt);
        else all[pos - 1].after(rebuilt);
        reindexResults();
      }
    } else {
      showToast((r && r.error) || "重试失败");
      btn.disabled = false;
      btn.textContent = oldText;
    }
  } catch (e) {
    showToast("重试失败：" + (e.message || "网络错误"));
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

/** 渲染单条结果卡片（供重试替换使用） */
function renderSingleResult(r, index) {
  const item = document.createElement("div");
  item.className = "result-item";
  item.dataset.sourceIndex = String(Number.isInteger(r.source_index) ? r.source_index : index);
  item.dataset.originalUrl = r.original_url || "";
  item.dataset.videoUrl = r.video_url || "";
  item.innerHTML = resultCardHtml(r, index);
  initCaptionToggles(item);
  return item;
}

async function retryFailedLinks() {
  const failed = latestResults.filter(r => !r.success && r.original_url);
  if (!failed.length || extractingNow) return;
  document.getElementById("inputUrls").value = failed.map(r => r.original_url).join("\n");
  updateLinkCount();
  showToast(`正在重试 ${failed.length} 条失败链接`);
  await doExtract();
}

/** 重新编号所有结果卡片索引 */
function reindexResults() {
  const box = document.getElementById("results");
  box.querySelectorAll(".result-item .result-index").forEach((el, i) => {
    el.textContent = "#" + (i + 1);
  });
}

// ---------------------------------------------------------------- 统计

async function loadStats() {
  try {
    const data = await apiFetch("/api/stats");
    renderStats(data);
  } catch (e) {
    document.getElementById("statsGrid").innerHTML =
      '<div class="card" style="color:var(--error);text-align:center;">统计加载失败</div>';
  }
}

function renderStats(s) {
  // 顶部指标卡
  const platformChips = Object.entries(s.platform_dist || {})
    .map(([name, cnt]) => `<span class="platform-chip">${esc(name)} ${cnt} 条</span>`)
    .join("");
  const grid = document.getElementById("statsGrid");
  grid.innerHTML = `
    <div class="stat-card ok">
      <div class="num">${s.total}</div>
      <div class="label">累计提取</div>
      <div class="sub">${s.ok} 成功 · ${s.fail} 失败</div>
    </div>
    <div class="stat-card">
      <div class="num">${s.success_rate}%</div>
      <div class="label">成功率</div>
      <div class="sub">${s.total ? "最近 200 条内统计" : "暂无数据"}</div>
    </div>
    <div class="card" style="grid-column: 1 / -1;">
      <h2 style="margin-bottom:4px;">平台分布</h2>
      <div class="platform-chips">${platformChips || '<span style="color:var(--text2);font-size:13px;">暂无成功提取记录</span>'}</div>
    </div>`;

  // 趋势折线图（SVG）
  const trend = document.getElementById("statsTrend");
  const hasData = s.trend && s.trend.some(t => t.count > 0);
  if (!hasData) {
    trend.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:20px 0;">近 7 天暂无提取记录</div>';
    return;
  }
  const W = 760, H = 160, padL = 34, padR = 10, padT = 22, padB = 24;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const max = Math.max(...s.trend.map(t => t.count), 1);
  const n = s.trend.length;
  const x = i => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const y = v => padT + plotH - (v / max) * plotH;

  // 网格线（3 条水平参考线）+ Y 轴刻度
  let trendGrid = "";
  for (let g = 0; g <= 2; g++) {
    const val = Math.round((max / 2) * g);
    const gy = y(val);
    trendGrid += `<line class="grid-line" x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}"/>`;
    trendGrid += `<text class="axis-label" x="${padL - 6}" y="${gy + 3}" text-anchor="end">${val}</text>`;
  }

  // 折线 path + 面积渐变底色
  const points = s.trend.map((t, i) => `${x(i)},${y(t.count)}`);
  const linePath = "M" + points.join(" L");
  const areaPath = `${linePath} L${x(n - 1)},${padT + plotH} L${x(0)},${padT + plotH} Z`;

  const dots = s.trend.map((t, i) => `
    <circle class="dot" cx="${x(i)}" cy="${y(t.count)}" r="4">
      <title>${esc(t.date)}：${t.count} 条</title>
    </circle>
    <text class="value-label" x="${x(i)}" y="${y(t.count) - 9}" text-anchor="middle">${t.count}</text>
    <text class="axis-label" x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(t.date)}</text>`).join("");

  trend.innerHTML = `
    <svg class="trend-line" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${trendGrid}
      <path d="${areaPath}" fill="var(--primary)" opacity="0.08"/>
      <path d="${linePath}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
    </svg>`;
}

          <div class="history-card-content">

              ? `
            <div class="field" style="margin-top:8px;">
              <div class="field-label">转换链接</div>
              <div class="field-value link" title="${esc(h.canonical_url || h.original_url)}">${esc(h.canonical_url || h.original_url)}</div>
            </div>
            ${h.caption ? `<div class="field"><div class="field-label">文案</div><div class="caption-wrap"><div class="field-value caption">${esc(h.caption)}</div><button class="caption-toggle" type="button" onclick="toggleCaption(this)">展开全部 ▼</button></div></div>` : ""}
            <div class="copy-row">
              <button class="btn btn-sm btn-copy" onclick="copyText(this.parentNode.parentNode.querySelector('.link').innerText, this)">复制链接</button>
              ${h.caption ? `<button class="btn btn-sm btn-copy" onclick="copyText(this.parentNode.parentNode.querySelector('.caption').innerText, this)">复制文案</button>` : ""}
            </div>`
              : `
            <div class="field" style="margin-top:8px;">
              <div class="field-label">原始链接</div>
              <div class="field-value link" title="${esc(h.original_url)}">${esc(h.original_url)}</div>
            </div>
            <div class="field"><div class="field-label">错误</div><div class="field-value" style="color:var(--error);">${esc(h.error)}</div></div>`}
          </div>
        </div>
      </div>
    `).join("");
    initCaptionToggles(list);
  } catch (e) {
    status.textContent = "加载历史失败";
  }
}

let clearArmTimer = null;

async function clearHistory() {
  const btn = document.getElementById("btnClearHistory");
  // 二次确认：第一次点击进入确认态，3 秒内再点才真正执行
  if (!btn.classList.contains("confirming")) {
    btn.classList.add("confirming");
    btn.textContent = "⚠ 再点一次确认清空";
    clearTimeout(clearArmTimer);
    clearArmTimer = setTimeout(() => {
      btn.classList.remove("confirming");
      btn.textContent = "🗑 清空历史";
    }, 3000);
    return;
  }
  clearTimeout(clearArmTimer);
  btn.classList.remove("confirming");
  btn.textContent = "🗑 清空历史";
  try {
    await apiFetch("/api/history", { method: "DELETE" });
    showToast("历史已清空");
    loadHistory();
  } catch (e) {
    showToast("清空失败");
  }
}
